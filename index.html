  <body>
    <div id="root"></div>
    <script>
      // GitHub Pages has no server-side routing, so a direct load of e.g.
      // /trs-demo/careers 404s before React Router ever runs. 404.html
      // redirects here with the intended path stashed in the query string;
      // this restores it to the URL bar before the app mounts.
      (function () {
        var redirect = sessionStorage.getItem("spa-redirect");
        if (redirect) {
          sessionStorage.removeItem("spa-redirect");
          history.replaceState(null, "", redirect);
        }
      })();
    </script>
  </body>
